  <script>
    (function () {
      // Блокировка системных свайпов
      var preventSwipe = function (e) {
        var touch = (e.touches && e.touches.length > 0) ? e.touches[0] :
          ((e.changedTouches && e.changedTouches.length > 0) ? e.changedTouches[0] : null);

        if (touch && touch.clientX < 40) {
          e.preventDefault();
        }
      };

      window.addEventListener('touchstart', preventSwipe, {passive: false});
      window.addEventListener('touchmove', preventSwipe, {passive: false});

      window.history.pushState(null, null, window.location.href);
      window.addEventListener('popstate', function (event) {
        window.history.pushState(null, null, window.location.href);
      });

      // Глобальная функция для вызова из Flutter при переключении темы
      window.updateSystemTheme = function (isDarkMode) {
        var body = document.body;
        var metaStatus = document.getElementById('ios-status-bar');
        var themeColor = document.querySelector('meta[name="theme-color"]');

        if (isDarkMode) {
          body.style.backgroundColor = "#121212"; // Цвет подложки идеально совпадает с Material 3 Dark AppBar
          if (metaStatus) metaStatus.setAttribute('content', 'black-translucent');
          if (themeColor) themeColor.setAttribute('content', '#121212');
        } else {
          body.style.backgroundColor = "#00796B"; // Бирюзовый цвет светлой темы
          if (metaStatus) metaStatus.setAttribute('content', 'default');
          if (themeColor) themeColor.setAttribute('content', '#00796B');
        }
      };
    })();
  </script>

<!-- Окно с инструкцией -->
<div id="pwa-install-prompt" class="iphoneinstall">
    <h3>Установите приложение</h3>

    <img src="assets/img/7.png" alt="Шаг 1" width="100">
    <button onclick="closePrompt()">Понятно</button>
</div>
<script>
function initPWAInstallation() {
    const isIos = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
    
    // Проверяем, запущено ли уже как PWA (standalone)
    const isStandalone = window.matchMedia('(display-mode: standalone)').matches 
                        || window.navigator.standalone;

    // Проверяем, скрывал ли пользователь инструкцию ранее
    const isDismissed = localStorage.getItem('pwa_prompt_dismissed');

    // Показываем только если: это iOS, еще не установлено и не скрыто вручную
    if (isIos && !isStandalone && !isDismissed) {
        document.getElementById('pwa-install-prompt').style.display = 'block';
    }
}

function closePrompt() {
    document.getElementById('pwa-install-prompt').style.display = 'none';
    // Запоминаем, что пользователь закрыл окно, чтобы не бесить его
    localStorage.setItem('pwa_prompt_dismissed', 'true');
}

// Запускаем проверку при загрузке страницы
window.onload = initPWAInstallation;
</script>


<!--android-->
<button id="android-install-btn" style="display: none; position: fixed; top: 10px; right: 10px; padding: 10px; z-index: 1000;">
    Установить приложение
</button>
<script>
let deferredPrompt; // Переменная для хранения события
const installBtn = document.getElementById('android-install-btn');

window.addEventListener('beforeinstallprompt', (e) => {
    // 1. Предотвращаем автоматический показ системного мини-баннера
    e.preventDefault();
    // 2. Сохраняем событие, чтобы вызвать его позже по клику
    deferredPrompt = e;
    // 3. Показываем нашу кнопку установки
    installBtn.style.display = 'block';

    console.log("'beforeinstallprompt' сработал");
});

installBtn.addEventListener('click', async () => {
    if (deferredPrompt) {
        // 4. Показываем системное окно установки
        deferredPrompt.prompt();
        
        // 5. Ждем ответа пользователя (установил или отменил)
        const { outcome } = await deferredPrompt.userChoice;
        console.log(`Результат установки: ${outcome}`);
        
        // 6. В любом случае скрываем нашу кнопку после взаимодействия
        deferredPrompt = null;
        installBtn.style.display = 'none';
    }
});

// Дополнительно: скрываем кнопку, если приложение уже установлено
window.addEventListener('appinstalled', () => {
    console.log('PWA установлено успешно');
    installBtn.style.display = 'none';
    deferredPrompt = null;
});

</script>
